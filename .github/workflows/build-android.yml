name: Build Android Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 固定签名：首次构建生成 release.keystore 并提交回仓库，之后每次构建都用同一把 key，
      # 这样新版本才能覆盖安装旧版本。local.properties 每次构建重新生成，不进仓库。
      - name: Ensure fixed signing keystore
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore ./release.keystore \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias rikkahub \
              -dname "CN=RikkaHub Agent, O=GM, C=CN" \
              -keyalg RSA -keysize 2048 -validity 10000
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f release.keystore
            git commit -m "chore: add fixed signing keystore [skip ci]"
            git push
          fi
          printf 'storeFile=%s/release.keystore\nstorePassword=android\nkeyAlias=rikkahub\nkeyPassword=android\n' "$GITHUB_WORKSPACE" > local.properties
          cat local.properties

      # 覆盖安装策略：**固定 versionCode，绝不自动递增**。
      #
      # Android 规则：同包名 + 同签名 + versionCode 不小于已装版本，才允许覆盖安装。
      #   versionCode 更大 -> 能覆盖（升级）
      #   versionCode 相等 -> 能覆盖（**双向，可回退**）
      #   versionCode 更小 -> 拒绝（INSTALL_FAILED_VERSION_DOWNGRADE）
      #
      # 需求是「新版本能覆盖旧版本；新版本翻车时，旧版本还能装回去」，
      # 而工作区数据有几个 G，卸载重装代价太高。要做到双向可覆盖，
      # 唯一解就是所有包保持**相同 versionCode**（190）。
      #
      # 所以这里只做校验，不改值：一旦有人误改 versionCode，构建直接失败，
      # 避免产出无法双向覆盖的包。签名与包名也别动：
      #   applicationId = excp.rikkahub.agent
      #   signing        = 仓库内 release.keystore（固定 key）
      - name: Verify versionCode stays fixed (bidirectional overwrite-install)
        run: |
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          EXPECTED=190
          echo "versionCode=$CODE versionName=$NAME (expected $EXPECTED)"
          if [ "$CODE" != "$EXPECTED" ]; then
            echo "::error::versionCode 必须是 $EXPECTED，否则新老包无法双向覆盖安装（会丢工作区数据）。"
            exit 1
          fi
          APKID=$(grep -oP 'applicationId = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "applicationId=$APKID.agent"
          if [ -f release.keystore ]; then
            echo "release.keystore present (fixed signing key)"
          else
            echo "::error::release.keystore 缺失，签名会变，无法覆盖安装。"
            exit 1
          fi

      # 先跑单元测试再打包：此前 workflow 只跑 assembleRelease，
      # 仓库里的单测从未在 CI 执行过，等于没有回归网。
      #
      # run #41 已取到基线并确认全绿：
      #   ai  307 tests / 0 failures / 0 skipped（37 个测试类）
      #   app 1723 tests / 0 failures / 0 skipped（217 个测试类）
      #   合计 2030 tests，含本轮移植的 McpToolSchemaTest 与
      #   ChatCompletionsStreamDecoderNullTest
      # 因此改为硬门禁：测试失败即中断，不再产出 APK。
      - name: Run unit tests (app + ai)
        run: ./gradlew :ai:testDebugUnitTest :app:testDebugUnitTest --no-daemon --stacktrace --continue

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-run${{ github.run_number }}
          path: |
            app/build/reports/tests/
            ai/build/reports/tests/
          if-no-files-found: ignore

      - name: Build Release APK (arm64-v8a only, R8 optimized)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage APK with versioned name
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          PKG=$(grep -oP 'applicationId = "\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          echo "version=$VER versionCode=$CODE applicationId=$PKG"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "RikkaHub-$VER-arm64-v8a.apk"
          ls -la "RikkaHub-$VER-arm64-v8a.apk"

      # versionName/versionCode 在多次构建间可能完全相同（本仓常见），
      # 只有 SHA-256 能唯一区分产物。写进 Step Summary，便于事后核对装的是哪个包。
      - name: Compute APK SHA-256 and write build summary
        run: |
          APK=$(ls RikkaHub-*-arm64-v8a.apk | head -1)
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          {
            echo "## RikkaHub build run #${{ github.run_number }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| branch | \`${GITHUB_REF_NAME}\` |"
            echo "| versionName | \`$VER\` |"
            echo "| versionCode | \`$CODE\` |"
            echo "| APK 文件 | \`$APK\` |"
            echo "| APK 字节数 | `$SIZE` |"
            echo "| applicationId | `$(grep -oP 'applicationId = \"\K[^\"]+' app/build.gradle.kts | head -1).agent` |"
            echo "| **SHA-256** | `$SHA` |"
            echo ""
            echo "versionCode 固定为 \`$CODE\`：可覆盖安装任意历史包，也可用任意历史包回退覆盖本包。"
            echo "回退时直接从旧 run 的 artifact 下载对应 APK 安装即可，无需卸载。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK=$APK"
          echo "SHA256=$SHA"
          echo "SIZE=$SIZE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-run${{ github.run_number }}-arm64
          path: RikkaHub-*-arm64-v8a.apk
          if-no-files-found: error
