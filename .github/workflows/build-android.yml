name: Build Android Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 固定签名：首次构建生成 release.keystore 并提交回仓库，之后每次构建都用同一把 key，
      # 这样新版本才能覆盖安装旧版本。local.properties 每次构建重新生成，不进仓库。
      - name: Ensure fixed signing keystore
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore ./release.keystore \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias rikkahub \
              -dname "CN=RikkaHub Agent, O=GM, C=CN" \
              -keyalg RSA -keysize 2048 -validity 10000
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f release.keystore
            git commit -m "chore: add fixed signing keystore [skip ci]"
            git push
          fi
          printf 'storeFile=%s/release.keystore\nstorePassword=android\nkeyAlias=rikkahub\nkeyPassword=android\n' "$GITHUB_WORKSPACE" > local.properties
          cat local.properties

      - name: Build Release APK (arm64-v8a only, R8 optimized)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-Agent-APK
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
